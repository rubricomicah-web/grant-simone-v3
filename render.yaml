services:
  - type: web
    name: grant-simone
    env: python
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: PAYMENT_REQUIRED
        value: false
      - key: PAYMENTS_ENABLED
        value: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: false
